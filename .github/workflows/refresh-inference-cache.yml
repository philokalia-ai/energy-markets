name: Refresh Inference Cache

on:
  schedule:
    # Run annually on January 1st at 2 AM UTC (before daily price generation)
    - cron: "0 2 1 1 *"
  workflow_dispatch:
    inputs:
      reference_date:
        description: "Reference date for inference (YYYY-MM-DD). Uses 12 months of data before this date."
        required: false
        default: ""
        type: string
      parallel:
        description: "Use parallel processing"
        required: false
        default: true
        type: boolean
      max_workers:
        description: "Maximum parallel workers (0 = auto-detect, uses all CPU cores)"
        required: false
        default: "0"
        type: string

env:
  JULIA_VERSION: "1.11"
  JULIA_NUM_THREADS: 4

jobs:
  refresh-inference-cache:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 480 # 8 hours timeout (inference can be slow)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v1

      - name: Install Julia dependencies
        run: |
          julia --project=. -e "
            using Pkg
            println(\"📦 Resolving dependencies...\")
            Pkg.resolve()
            println(\"📦 Installing dependencies...\")
            Pkg.instantiate()
            Pkg.precompile()
            println(\"✅ Dependencies installed successfully\")
          "

      - name: Setup database connection
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
        run: |
          julia --project=. -e "
            using Euphemia
            println(\"🔗 Testing database connection...\")
            try
              result = Euphemia.sql2df(\"SELECT 1 as test\")
              println(\"✅ Database connection successful\")
            catch e
              println(\"❌ Database connection failed: \$e\")
              exit(1)
            end
          "

      - name: Refresh inference cache
        id: refresh
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
        run: |
          # Set default reference date if not specified (today)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            REFERENCE_DATE=$(date +%Y-%m-%d)
            PARALLEL=true
            MAX_WORKERS=4
          else
            REFERENCE_DATE="${{ github.event.inputs.reference_date }}"
            if [ -z "$REFERENCE_DATE" ]; then
              REFERENCE_DATE=$(date +%Y-%m-%d)
            fi
            PARALLEL="${{ github.event.inputs.parallel }}"
            MAX_WORKERS="${{ github.event.inputs.max_workers }}"
          fi

          echo "🔄 Inference Cache Refresh"
          echo "📅 Reference date: $REFERENCE_DATE"
          echo "⚡ Parallel: $PARALLEL"
          echo "👥 Max workers: $MAX_WORKERS"

          export REFERENCE_DATE PARALLEL MAX_WORKERS

          julia --project=. bin/refresh_inference_cache.jl

      - name: Create execution summary
        if: always()
        run: |
          echo "## 🔄 Inference Cache Refresh Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "schedule" ]; then
            TRIGGER="⏰ Scheduled (annual)"
            REF_DATE="$(date +%Y-%m-%d)"
          else
            TRIGGER="🖱️ Manual"
            REF_DATE="${{ github.event.inputs.reference_date || 'today' }}"
          fi

          echo "### Execution Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: $TRIGGER" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference Date**: $REF_DATE" >> $GITHUB_STEP_SUMMARY
          echo "- **Parallel**: ${{ github.event.inputs.parallel || 'true' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Max Workers**: ${{ github.event.inputs.max_workers || '4' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.refresh.outputs.status }}" = "success" ]; then
            echo "### ✅ Results" >> $GITHUB_STEP_SUMMARY
            echo "- **Zones Processed**: ${{ steps.refresh.outputs.successful_zones }}/${{ steps.refresh.outputs.total_zones }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Failed**: ${{ steps.refresh.outputs.failed_zones }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Processing Time**: ${{ steps.refresh.outputs.processing_time_seconds }}s" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Failure" >> $GITHUB_STEP_SUMMARY
            ERROR_MSG="${{ steps.refresh.outputs.error_message || 'Unknown error' }}"
            echo "- **Error**: ${ERROR_MSG}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: |
            🚨 Inference cache refresh failed!
            🔗 View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

      - name: Notify on success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: |
            ✅ Inference cache refresh completed!
            📊 Processed: ${{ steps.refresh.outputs.successful_zones }}/${{ steps.refresh.outputs.total_zones }} zones
        continue-on-error: true

# On-demand web data-plane publish — the same export+push the daily forecast
# runs at the end of its cycle, dispatchable any time (e.g. after a record
# backfill, a data fix, or to fill a freshly-deployed page without waiting
# for tonight's run). Runs in a runner pod that sees /opt/euphemia of the
# server read-only; record books staged under /opt/euphemia/data (data/ is
# git-ignored) are pushed additively from there via the books_dir input.
#
# Scheduled 11:30 UTC (phase 3): the tsfm-postsim workflow writes the post-sim
# Timestral overlay vintage (Timestral + physics) at 10:40 UTC (dispatched by the
# k3s CronJob gh-energy-markets-dispatch-1040); this re-export makes those DB rows
# reach the site the same day instead of at the next 06:30 cycle.
# Under `schedule` the dispatch inputs are empty: the inputs export is skipped
# and books_dir is empty (the books step warns and exits 0).
name: publish-web-data

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      include_inputs:
        description: "Also export the Predictions-page v1/inputs data plane (open-meteo pull)"
        type: boolean
        default: true
      inputs_back_days:
        description: "Trailing window (days) for the inputs export; keep <= the local prevruns retention to avoid public-API fallback"
        required: false
        default: ""

      books_dir:
        description: "Absolute path (runner host) of per-day book parquets to push additively; 'none' = skip"
        required: false
        default: "/opt/euphemia/data/web/v1/books"

# One publisher at a time. daily-forecast has its own group (daily-forecast) and
# pushes the same zone objects + manifest, so the first step below also waits
# for any queued/in-progress daily-forecast run and skips the push if it is
# still running after 90 min (the next cycle republishes everything anyway).
concurrency:
  group: publish-web-data
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: energy-markets-k8s
    timeout-minutes: 150
    steps:
      - name: Wait for daily-forecast (no two writers on the R2 data plane)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          api="https://api.github.com/repos/$REPO/actions/workflows/daily-forecast.yml/runs"
          for i in $(seq 1 90); do
            n=0
            for st in queued in_progress waiting pending requested; do
              c=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    "$api?status=$st&per_page=1" | python3 -c "import json,sys; print(json.load(sys.stdin)['total_count'])") || c=1
              n=$((n + c))
            done
            if [ "$n" -eq 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; echo "no daily-forecast run active"; exit 0; fi
            echo "daily-forecast active ($n run(s)); waiting ($i/90 min)"
            sleep 60
          done
          echo "::warning::daily-forecast still active after 90 min; skipping this publish (the daily cycle republishes)"
          echo "go=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: ${{ steps.gate.outputs.go == 'true' }}

      - name: Setup Julia
        if: ${{ steps.gate.outputs.go == 'true' }}
        uses: julia-actions/setup-julia@v1
        with:
          version: "1.13.4"   # same pin as daily-forecast.yml / transfer-record.yml

      - name: Export web parquet (prices data plane)
        if: ${{ steps.gate.outputs.go == 'true' }}
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
          # naive baselines on the scoreboard (#431); repo variable EXPORT_NAIVE=0 switches them off
          EXPORT_NAIVE: ${{ vars.EXPORT_NAIVE || '1' }}
          # evaluation target (#431 C2): empty = sdac; repo variable EUPHEMIA_DA_TARGET=highest_seq = kill switch
          EUPHEMIA_DA_TARGET: ${{ vars.EUPHEMIA_DA_TARGET }}
        run: |
          julia --project=. -e 'using Pkg; isempty(Pkg.Registry.reachable_registries()) && Pkg.Registry.add(); Pkg.instantiate()'
          julia --project=. bin/export_web_parquet.jl

      - name: Export prediction inputs (v1/inputs, non-fatal)
        if: ${{ steps.gate.outputs.go == 'true' && (inputs.include_inputs) }}
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
          INPUTS_BACK_DAYS: ${{ inputs.inputs_back_days }}
          EUPHEMIA_OPENMETEO_PREVRUNS_URL: "http://open-meteo.weather.svc.cluster.local/v1/forecast"
        run: |
          julia --project=. bin/export_prediction_inputs.jl \
            || echo "::warning::prediction-inputs export failed — core web data still published"

      - name: Stage record books additively
        if: ${{ steps.gate.outputs.go == 'true' && (inputs.books_dir != 'none') }}
        run: |
          test -d "${{ inputs.books_dir }}" || { echo "::warning::books_dir missing on runner host — skipping books"; exit 0; }
          mkdir -p data/web/v1/books
          # Hard-link into staging (same filesystem) so web_data_push's additive
          # books sync carries them; falls back to copy across filesystems.
          cp -al "${{ inputs.books_dir }}"/. data/web/v1/books/ 2>/dev/null || \
            cp -a "${{ inputs.books_dir }}"/. data/web/v1/books/
          echo "staged $(ls data/web/v1/books/*.parquet | wc -l) book parquets"

      - name: Push to the web bucket (manifest last)
        if: ${{ steps.gate.outputs.go == 'true' }}
        env:
          EXTRACT_S3_ENDPOINT: ${{ secrets.EXTRACT_S3_ENDPOINT }}
          WEB_S3_ACCESS_KEY_ID: ${{ secrets.WEB_S3_ACCESS_KEY_ID }}
          WEB_S3_SECRET_ACCESS_KEY: ${{ secrets.WEB_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: bash bin/web_data_push.sh

      - name: Verify live
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.philokalia.ai/api/v1/manifest")
          echo "manifest: $code"; [ "$code" = "200" ] || exit 1
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.philokalia.ai/api/v1/books/GR/2026-07-15")
          echo "books GR/2026-07-15: $code"
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.philokalia.ai/api/v1/inputs/manifest")
          echo "inputs manifest: $code"

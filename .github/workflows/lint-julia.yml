name: Julia lint and format

on:
  pull_request:
    paths:
      - '**/*.jl'
      - 'tools/julia-lint/**'
      - '.github/workflows/lint-julia.yml'
  push:
    branches: [main]
    paths:
      - '**/*.jl'
      - 'tools/julia-lint/**'
      - '.github/workflows/lint-julia.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: julia-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  julia-lint:
    # Fork PR code must run on GitHub-hosted, never on our self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/julia-lint
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: tools/julia-lint/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: ESLint (fails on error rules only)
        run: npm run lint
      - name: Prettier check (advisory until the repo is formatted)
        continue-on-error: true
        run: npm run format:check

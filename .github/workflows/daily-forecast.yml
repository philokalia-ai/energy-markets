name: Daily ex-ante forecast
# ceres finds the run it dispatched by this name (its dispatch_id); the 06:30 k3s dispatch has none.
run-name: "Daily ex-ante forecast ${{ github.event.inputs.run_profile || 'pregate' }} ${{ github.event.inputs.dispatch_id }}"

# PRE-GATE 7-LEAD RUN (Aug 2026, docs/experiments/pregate-7lead.md): the 06:30 UTC
# run produces the WEATHER (ex-ante) track for ALL leads D+1..D+7 BEFORE the
# 12:00 CET auction. Lead-1 (tomorrow) is therefore a genuine PRE-GATE forecast.
# At 06:30 tomorrow's Day-ahead ATC has not yet published, so the run sets
# EUPHEMIA_FORECAST_PREGATE=true (the network build degrades to the cv27
# demonstrated-capability fallback, and the ATC eligibility gate does not block).
#
# The ceres `update_entsoe_data` workflow (08:00 weather / 12:30 + 17:30 + 19:30
# entsoe, SELF-HEALING) STILL runs the evening REFRESH — it detects a missing
# lead-1 slice, re-pulls the four D-1 input feeds and retries. The evening
# refresh remains the reference/entsoe track's freeze; ceres-side coordination
# may retire it once the pre-gate weather track is trusted. This workflow also
# stays the manual/debug runner (workflow_dispatch) with the HiGHS default.
# ONE trigger per slot (2026-11-24): the 06:30 pre-gate slot is fired only by the k3s CronJob
# gh-energy-markets-dispatch-0630 (exact time; run_profile=pregate). The GitHub schedule that ran the same slot a
# few minutes later (and found every slice frozen) is removed. ceres dispatches lead1/morning/entsoe.
on:
  workflow_dispatch:
    inputs:
      force_rerun:
        description: "Rewrite existing (market_date, lead_days, code_version) slices"
        required: false
        default: false
        type: boolean
      # ceres (option a, 2026-11-24): ceres keeps the ETL pulls and its lead-1 retry loop and dispatches ONE
      # attempt of this workflow per pull, then reads the run's `presence` artifact (never Postgres).
      #   pregate  06:30 weather track, leads 2..7 before the gate (the k3s 06:30 dispatch; also the default)
      #   lead1    ceres jao_pregate (08:55 / 09:55): weather lead 1 only, pre-gate, JAO-aware (require_jao)
      #   morning  ceres 08:00: weather track, leads 1..7 + the persistence horizon
      #   entsoe   ceres 12:30 / 17:30 / 19:30: reference (entsoe) track, leads 1..7 + the persistence horizon
      run_profile:
        description: "Run profile: pregate | lead1 | morning | entsoe (empty = pregate)"
        required: false
        default: ""
        type: string
      require_jao:
        description: "lead1 only: skip the day unless JAO has published (the 08:55 slot)"
        required: false
        default: false
        type: boolean
      dispatch_id:
        description: "Correlation id the dispatcher (ceres) uses to find this run (echoed in the run name)"
        required: false
        default: ""
        type: string

# One group per run profile: GitHub keeps one running + ONE pending run per group and a newer queued run cancels
# the older pending one, so a single group would let e.g. the 09:55 lead1 dispatch cancel the 08:55 one queued
# behind a long 08:00 morning run. Profiles run in parallel as they did as separate ceres jobs; a profile never
# queues behind itself (ceres waits for its own run before the next attempt). Two profiles writing the same slice
# (morning and lead1 both write the weather lead 1 of tomorrow): no-clobber is decided when a run starts, so the
# FIRST run to freeze the slice normally wins and the other skips it; if both start before either transfers, both
# compute it and the later transfer replaces the zones it wrote (the live plan "insert", inside one Postgres
# transaction). That is the same race the two ceres jobs have on the Postgres path today.
concurrency:
  group: daily-forecast-${{ github.event.inputs.run_profile || 'pregate' }}
  cancel-in-progress: false

env:
  JULIA_VERSION: "1.13.4"
  JULIA_NUM_THREADS: 4
  # Evaluation target of the scorer/exporters (#431 C2): empty = sdac (the default since
  # 2026-11-17). Kill switch without a code change: repo variable EUPHEMIA_DA_TARGET=highest_seq.
  # Model inputs are pinned separately (EUPHEMIA_DA_INPUT, default highest_seq).
  EUPHEMIA_DA_TARGET: ${{ vars.EUPHEMIA_DA_TARGET }}
  # Weather source: the SELF-HOSTED open-meteo (a Service in the cluster the
  # runner pod is in; serves wind_speed_100m + shortwave_radiation since infra#9). No public
  # rate limits, no external dependency for the ex-ante product; if it is
  # down, fetch_weather falls back to the public API automatically. Honest
  # note: the self-hosted GFS cycle can lag the public blend by one sync
  # (~2-4 km/h wind differences observed; GHI ±5 W/m²) — the 17:30/19:30
  # evening ETLs keep the gap small.
  EUPHEMIA_OPENMETEO_URL: "http://open-meteo.weather.svc.cluster.local/v1/forecast"
  EUPHEMIA_OPENMETEO_ARCHIVE_URL: "http://open-meteo.weather.svc.cluster.local/v1/archive"
  # Previous-runs (leads ≥ 1, the D-1..D-7 vintages) also try the self-hosted
  # instance FIRST. It cannot serve previous_dayN yet (it holds no previous-run
  # chunks — infra manifests/weather/PREVIOUS_RUNS.md), so each prevruns batch
  # gets one fast in-cluster probe that returns all-null and then transparently
  # falls through to the public previous-runs API (the null-data fallback in
  # weather_res.jl/weather_load.jl). Harmless today; free the moment the instance
  # can serve previous runs. The durable local archive is data/gfs_vintages/
  # (capture-gfs-vintages.yml).
  EUPHEMIA_OPENMETEO_PREVRUNS_URL: "http://open-meteo.weather.svc.cluster.local/v1/forecast"

jobs:
  daily-forecast:
    runs-on: energy-markets-k8s
    timeout-minutes: 150   # step timeouts (fill 25 + clears 75 + transfer 10 + score 15 + transfer 10) fit inside
    env:
      # Run-local DuckDB pair: inputs.duckdb (filled from Postgres, read-only) + results.duckdb (seeded with the
      # forecast/score slices this job reads back; every result write lands here, then ONE transfer step).
      RUN_DIR: ${{ github.workspace }}/run-local
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ env.JULIA_VERSION }}


      - name: Set forecast defaults
        run: |
          # HiGHS is the only solver.
          echo "FORECAST_SKIP_CLEAR=false" >> $GITHUB_ENV
          echo "FORECAST_OPTIMIZER=highs" >> $GITHUB_ENV

      - name: Install Julia dependencies
        run: |
          julia --project=. -e "
            using Pkg
            isempty(Pkg.Registry.reachable_registries()) && Pkg.Registry.add()
            println(\"📦 Resolving dependencies...\")
            Pkg.resolve()
            println(\"📦 Installing dependencies...\")
            Pkg.instantiate()
            Pkg.precompile()
            println(\"✅ Dependencies installed successfully\")
          "

      - name: Fill run-local DuckDB (the job's only Postgres read)
        timeout-minutes: 25
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
        run: |
          # Copies every row this job reads (inputs for the 7 UTC-day clears, the forecast/score slices the
          # no-clobber checks, the scorer and the exporters read back) into $RUN_DIR via DuckDB's postgres
          # extension; fails the job (no partial file) on any error. Per-table rows/seconds: $RUN_DIR/fill.json.
          julia --project=. bin/fill_run_duckdb.jl --profile daily-forecast --out "$RUN_DIR"

      # Step timeouts sum below the job's: a step that times out FAILS (it is not cancelled), so the
      # transfer after it still runs and every slice already written reaches Postgres.
      - name: Generate daily forecasts
        timeout-minutes: 75
        env:
          # fill → run → transfer (owner rule 2026-11-23): reads only the run-local DuckDB, writes only its
          # results file; no Postgres credentials in this step.
          EUPHEMIA_DATA_STORE: duckdb
          EUPHEMIA_DUCKDB_PATH: ${{ env.RUN_DIR }}/inputs.duckdb
          EUPHEMIA_DUCKDB_READONLY: "true"
          EUPHEMIA_RESULTS_DB: ${{ env.RUN_DIR }}/results.duckdb
          EUPHEMIA_RESULTS_WRITABLE: "true"
        run: |
          PROFILE="${{ github.event.inputs.run_profile || 'pregate' }}"
          # the profile's environment (one source with measure-duckdb-path.yml); the pre-gate run degrades the
          # network to the demonstrated-capability fallback (tomorrow's Day-ahead ATC is not published yet)
          eval "$(bash bin/forecast_profile_env.sh "$PROFILE" "${{ github.event.inputs.require_jao || 'false' }}")" || exit 1
          FORCE_RERUN="${{ github.event.inputs.force_rerun || 'false' }}"

          OPTIMIZER="$FORECAST_OPTIMIZER"
          SKIP_CLEAR="$FORECAST_SKIP_CLEAR"

          echo "🔮 Daily ex-ante forecast"
          echo "⚖️ Optimizer: $OPTIMIZER (skip_clear=$SKIP_CLEAR)"
          echo "📅 Max lead days: $MAX_LEAD_DAYS   🛰️ input_mode: $INPUT_MODE   🌅 pre-gate: $EUPHEMIA_FORECAST_PREGATE"
          echo "🔄 Force rerun: $FORCE_RERUN"

          export OPTIMIZER MAX_LEAD_DAYS MIN_LEAD_DAYS FORCE_RERUN SKIP_CLEAR INPUT_MODE EUPHEMIA_FORECAST_PREGATE
          [ -n "${EUPHEMIA_REQUIRE_JAO:-}" ] && export EUPHEMIA_REQUIRE_JAO
          # later steps (horizon, presence) need the resolved profile and track
          { echo "RUN_PROFILE=$PROFILE"
            echo "FORECAST_INPUT_MODE=$INPUT_MODE"; } >> "$GITHUB_ENV"

          # Crash-retry (issue #182: HiGHS segfaults ~3-4% of decomposed
          # day-solves). Forecast slices are no-clobber, so a retry skips
          # everything already written and only redoes the crashed remainder —
          # the loop is idempotent.
          ok=false
          for attempt in 1 2 3; do
            if julia --project=. bin/daily_forecast.jl; then
              ok=true
              break
            fi
            echo "⚠️ forecast attempt $attempt failed — retrying (completed slices are skipped)"
          done
          if [ "$ok" != "true" ]; then
            echo "::error::daily forecast failed after 3 attempts"
            exit 1
          fi

      # Leads 2..7 by weekly persistence of the T-7 lead-1 entsoe clear (bin/horizon_forecast.jl), for the profiles
      # that ran it in ceres' predict job; runs even when the clear failed (its sources are older slices).
      - name: Fill the 7-day horizon (leads 2-7, weekly persistence)
        if: ${{ !cancelled() && (env.RUN_PROFILE == 'morning' || env.RUN_PROFILE == 'entsoe') }}
        timeout-minutes: 10
        env:
          EUPHEMIA_DATA_STORE: duckdb   # fill → run → transfer: the seeded slices in, results DuckDB out
          EUPHEMIA_DUCKDB_PATH: ${{ env.RUN_DIR }}/inputs.duckdb
          EUPHEMIA_DUCKDB_READONLY: "true"
          EUPHEMIA_RESULTS_DB: ${{ env.RUN_DIR }}/results.duckdb
          EUPHEMIA_RESULTS_WRITABLE: "true"
          MAX_LEAD_DAYS: "7"
          FORCE_RERUN: "false"
        run: |
          julia --project=. bin/horizon_forecast.jl

      # The forecast slices (and the cv32 corrections) reach Postgres right after the clears, before scoring and
      # export: a later timeout or failure cannot lose them. Exactly once (transfer_log): the second transfer
      # below applies only the ops logged after this one (the scores).
      - name: Transfer forecasts to Postgres
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
        run: |
          if [ -f "$RUN_DIR/results.duckdb" ]; then
            julia --project=. bin/transfer_run_results.jl --results-db "$RUN_DIR/results.duckdb"
          else
            echo "::warning::no run-local results DuckDB (the fill failed) — nothing to transfer"
          fi

      # What this attempt left in Postgres, from the run-local results DB only (seeded slices + this run's writes
      # whose transfer committed). ceres' lead-1 retry loop reads the `presence` artifact of the run it
      # dispatched (by dispatch_id) instead of querying Postgres.
      - name: Forecast presence (artifact for the dispatcher)
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f "$RUN_DIR/results.duckdb" ]; then echo "::warning::no results DuckDB — no presence"; exit 0; fi
          LEAD1_DATE=$(TZ=Europe/Athens date -d tomorrow +%Y-%m-%d)
          julia --project=. bin/forecast_presence.jl --results-db "$RUN_DIR/results.duckdb" \
            --input-mode "${FORECAST_INPUT_MODE:-weather}" --lead1-date "$LEAD1_DATE" \
            --profile "${RUN_PROFILE:-manual}" --dispatch-id "${{ github.event.inputs.dispatch_id }}" \
            --out "$RUN_DIR/presence.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload presence artifact
        if: ${{ !cancelled() && hashFiles('run-local/presence.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: presence
          path: run-local/presence.json
          retention-days: 7

      # Scoring/export/publish run even when the forecast step failed
      # (!cancelled()): whatever slices DID land — or landed in an earlier run
      # today — still get scored and pushed, so the site never goes stale
      # behind a solver crash. The job still reports failure (Slack notify).
      - name: Score realized forecasts
        if: ${{ !cancelled() && env.RUN_PROFILE != 'lead1' }}
        timeout-minutes: 15
        env:
          # fill → run → transfer (owner rule 2026-11-23): reads only the run-local DuckDB, writes only its
          # results file; no Postgres credentials in this step.
          EUPHEMIA_DATA_STORE: duckdb
          EUPHEMIA_DUCKDB_PATH: ${{ env.RUN_DIR }}/inputs.duckdb
          EUPHEMIA_DUCKDB_READONLY: "true"
          EUPHEMIA_RESULTS_DB: ${{ env.RUN_DIR }}/results.duckdb
          EUPHEMIA_RESULTS_WRITABLE: "true"
        run: |
          julia --project=. bin/score_forecasts.jl

      # The second (and last) Postgres write: the scores, plus anything the first transfer could not apply. Each
      # transfer replays the pending ops of results.duckdb in ONE Postgres transaction (guards and the retro plan
      # re-checked on Postgres; exactly once per op). Runs whenever anything may have landed.
      - name: Transfer scores to Postgres
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
        run: |
          if [ -f "$RUN_DIR/results.duckdb" ]; then
            julia --project=. bin/transfer_run_results.jl --results-db "$RUN_DIR/results.duckdb"
          else
            echo "::warning::no run-local results DuckDB (the fill failed) — nothing to transfer"
          fi

      - name: Export forecast JSON
        if: ${{ !cancelled() }}
        env:
          EUPHEMIA_DATA_STORE: duckdb   # reads the run-local DuckDB only (fill → run → transfer)
          EUPHEMIA_DUCKDB_PATH: ${{ env.RUN_DIR }}/inputs.duckdb
          EUPHEMIA_DUCKDB_READONLY: "true"
          EUPHEMIA_RESULTS_DB: ${{ env.RUN_DIR }}/results.duckdb
          # naive baselines on the scoreboard (#431); repo variable EXPORT_NAIVE=0 switches them off
          EXPORT_NAIVE: ${{ vars.EXPORT_NAIVE || '1' }}
        run: |
          julia --project=. bin/export_forecast_json.jl

      - name: Publish web data plane to R2 (parquet for api.philokalia.ai)
        if: ${{ !cancelled() }}
        env:
          EUPHEMIA_DATA_STORE: duckdb   # reads the run-local DuckDB only (fill → run → transfer)
          EUPHEMIA_DUCKDB_PATH: ${{ env.RUN_DIR }}/inputs.duckdb
          EUPHEMIA_DUCKDB_READONLY: "true"
          EUPHEMIA_RESULTS_DB: ${{ env.RUN_DIR }}/results.duckdb
          EXPORT_NAIVE: ${{ vars.EXPORT_NAIVE || '1' }}   # naive baselines (#431)
          EXTRACT_S3_ENDPOINT: ${{ secrets.EXTRACT_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          WEB_S3_ACCESS_KEY_ID: ${{ secrets.WEB_S3_ACCESS_KEY_ID }}
          WEB_S3_SECRET_ACCESS_KEY: ${{ secrets.WEB_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # The SPA reads api.philokalia.ai (R2-backed) since the #179
          # migration; nothing was pushing the parquet after each run, so the
          # site data plane went stale (manifest frozen at the last manual
          # push). Export + push here, manifest last (readers never see a
          # manifest newer than its objects).
          julia --project=. bin/export_web_parquet.jl
          # Predictions page data plane (v1/inputs/ — the open RES/load input
          # model: drivers + prediction + reference + actuals, additive contract,
          # bin/export_prediction_inputs.jl). Reuses the ML fetch machinery; it
          # hits open-meteo, so a transient fetch failure must NOT block the core
          # web-data publish — non-fatal, the manifest below still uploads last.
          julia --project=. bin/export_prediction_inputs.jl \
            || echo "::warning::prediction-inputs export failed — core web data still published"
          # Model-card VALID scores + per-lead skill (pillars 2-4, additive JSON
          # under v1/inputs/). Pure file work (no DB/open-meteo) but kept non-fatal
          # so a parse hiccup never blocks the core web-data publish.
          julia --project=. bin/export_prediction_scorecard.jl \
            || echo "::warning::prediction-scorecard export failed — core web data still published"
          bash bin/web_data_push.sh

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: |
            🚨 Daily ex-ante forecast failed!
            🔗 View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # TSFM overlay (owner decision 2026-11-15: publish, model Timestral-209M).
  # A SEPARATE job, so the core forecast job above is byte-for-byte unaffected by
  # anything here: it starts only after the core job finished successfully
  # (forecast + score + export + R2 publish done), has its own deadline and
  # bounded steps, and a failure or hang here can never cancel or delay the core
  # publication. It writes tomorrow's overlay vintage (lines + P(<=0)) into
  # simulations.tsfm_overlay, then re-runs the (idempotent) JSON export + R2
  # parquet publish so the overlay fields reach the site the same morning.
  # PRE-GATE: issue = D-1 06:30 UTC from settled prices only (`postsim` needs D's
  # lead-1 sim, which this workflow does not produce — leads 2..7 only;
  # docs/experiments/tsfm-2026-11/overlay.md). A prediction product next to
  # sim/gbm/stats; it never feeds the counterfactual.
  # Timeouts (measured 2026-11-15 on aarch64 under load, real weights + local
  # PostgreSQL 16): emitter 218 s (4 threads/4 cores) and 260 s (4 threads on
  # 2 cores); a reviewer run exceeded 420 s under heavier contention. The emitter
  # bound (30 min) is ~4x the worst observed, leaving room for production
  # scanner latency; the job bound is the sum of the step bounds.
  tsfm-overlay:
    needs: daily-forecast
    # the pre-gate overlay belongs to the 06:30 pre-gate run only (not to ceres' lead1/morning/entsoe dispatches)
    if: ${{ always() && needs.daily-forecast.result == 'success' && (github.event.inputs.run_profile || 'pregate') == 'pregate' }}
    runs-on: energy-markets-k8s
    timeout-minutes: 150
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      TSFM_ARM: timestral-209m      # pluggable: any arm registered in bin/emit_tsfm_overlay.py ARMS
      OVERLAY_MODE: pregate0630
      TSFM_THREADS: "4"
      RUN_DIR: ${{ github.workspace }}/run-local
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v4

      - name: Setup uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: bin/requirements-overlay.txt

      - name: Cache Timestral weights (pinned Hub revision)
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          key: hf-timestral-209m-9874d252ab0aae16f7f7c999f98f98d6ad7d8365

      - name: Install overlay Python environment (pinned)
        timeout-minutes: 15
        run: |
          uv venv --python 3.12 .venv-overlay
          VIRTUAL_ENV=.venv-overlay uv pip install --index-strategy unsafe-best-match \
            -r bin/requirements-overlay.txt

      - name: TSFM overlay (Timestral, pre-gate)
        timeout-minutes: 30
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
        run: |
          .venv-overlay/bin/python bin/emit_tsfm_overlay.py \
            --delivery tomorrow --mode "$OVERLAY_MODE" --write --threads "$TSFM_THREADS"

      # Re-publish so the overlay reaches the site today. Same commands as the
      # core job's export/publish (idempotent: the zone parquets are regenerated
      # in full, `--delete` touches only v1/zones; inputs/books/flows are synced
      # without delete or skipped when absent, so nothing the core job published
      # is removed).
      - name: Setup Julia
        timeout-minutes: 5
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Install Julia dependencies
        timeout-minutes: 30
        run: |
          julia --project=. -e "
            using Pkg
            isempty(Pkg.Registry.reachable_registries()) && Pkg.Registry.add()
            Pkg.instantiate()
            Pkg.precompile()
          "

      # Fill AFTER the overlay write, so the exporters read the new vintage from DuckDB (export profile).
      - name: Fill run-local DuckDB for the exporters
        timeout-minutes: 15
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
        run: |
          julia --project=. bin/fill_run_duckdb.jl --profile export --out "$RUN_DIR"

      - name: Export forecast JSON (with overlay)
        timeout-minutes: 15
        env:
          EUPHEMIA_DATA_STORE: duckdb   # reads the run-local DuckDB only (fill → run → transfer)
          EUPHEMIA_DUCKDB_PATH: ${{ env.RUN_DIR }}/inputs.duckdb
          EUPHEMIA_DUCKDB_READONLY: "true"
          EUPHEMIA_RESULTS_DB: ${{ env.RUN_DIR }}/results.duckdb
          EXPORT_NAIVE: ${{ vars.EXPORT_NAIVE || '1' }}   # naive baselines (#431)
        run: |
          julia --project=. bin/export_forecast_json.jl

      - name: Re-publish web data plane to R2 (with overlay)
        timeout-minutes: 20
        env:
          EUPHEMIA_DATA_STORE: duckdb   # reads the run-local DuckDB only (fill → run → transfer)
          EUPHEMIA_DUCKDB_PATH: ${{ env.RUN_DIR }}/inputs.duckdb
          EUPHEMIA_DUCKDB_READONLY: "true"
          EUPHEMIA_RESULTS_DB: ${{ env.RUN_DIR }}/results.duckdb
          EXPORT_NAIVE: ${{ vars.EXPORT_NAIVE || '1' }}   # naive baselines (#431)
          EXTRACT_S3_ENDPOINT: ${{ secrets.EXTRACT_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          WEB_S3_ACCESS_KEY_ID: ${{ secrets.WEB_S3_ACCESS_KEY_ID }}
          WEB_S3_SECRET_ACCESS_KEY: ${{ secrets.WEB_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          julia --project=. bin/export_web_parquet.jl
          bash bin/web_data_push.sh

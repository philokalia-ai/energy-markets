name: Daily ex-ante forecast

# SCHEDULING CONSOLIDATED (July 2026): all forecast scheduling lives in the
# ceres `update_entsoe_data` workflow (08:00 weather / 12:30 + 17:30 + 19:30
# entsoe, every run SELF-HEALING — it detects a missing lead-1 slice,
# re-pulls the four D-1 input feeds and retries, bounded by per-track
# deadlines). Scheduling forecasts here was redundant with that and had no
# ETL re-pull capability: when a TSO item was late this workflow could only
# skip and hope. This workflow remains as the manual/debug runner
# (workflow_dispatch only) with the same HiGHS production default.
on:
  workflow_dispatch:
    inputs:
      max_lead_days:
        description: "Furthest lead time to attempt (days ahead of today UTC)"
        required: false
        default: "7"
        type: string
      force_rerun:
        description: "Rewrite existing (market_date, lead_days, code_version) slices"
        required: false
        default: false
        type: boolean
      optimizer:
        description: "Solver (highs = production default; gurobi = development, academic license)"
        required: false
        default: "highs"
        type: choice
        options:
          - highs
          - gurobi

env:
  JULIA_VERSION: "1.12"
  JULIA_NUM_THREADS: 4
  # Weather source: the SELF-HOSTED open-meteo (same host as the runner;
  # serves wind_speed_100m + shortwave_radiation since infra#9). No public
  # rate limits, no external dependency for the ex-ante product; if it is
  # down, fetch_weather falls back to the public API automatically. Honest
  # note: the self-hosted GFS cycle can lag the public blend by one sync
  # (~2-4 km/h wind differences observed; GHI ±5 W/m²) — the 17:30/19:30
  # evening ETLs keep the gap small.
  EUPHEMIA_OPENMETEO_URL: "http://localhost:30555/v1/forecast"
  EUPHEMIA_OPENMETEO_ARCHIVE_URL: "http://localhost:30555/v1/archive"

jobs:
  daily-forecast:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v1

      - name: Select optimizer
        env:
          GUROBI_ACCESS_ID: ${{ secrets.WLSACCESSID }}
          GUROBI_WLS_SECRET: ${{ secrets.WLSSECRET }}
          GUROBI_LICENSE_ID: ${{ secrets.LICENSEID }}
          REQUESTED_OPTIMIZER: ${{ github.event.inputs.optimizer || 'highs' }}
        run: |
          # Production default is HiGHS (open-source): since cv20 the 39-zone
          # clear runs in canonical per-period-decomposed mode, which HiGHS
          # solves and which is bit-identical across solvers. Gurobi (academic
          # license — development/research use only) is available via the
          # workflow_dispatch optimizer input.
          echo "FORECAST_SKIP_CLEAR=false" >> $GITHUB_ENV
          if [ "$REQUESTED_OPTIMIZER" = "gurobi" ]; then
            if [ -n "$GUROBI_ACCESS_ID" ] && [ -n "$GUROBI_WLS_SECRET" ] && [ -n "$GUROBI_LICENSE_ID" ]; then
              echo "::add-mask::$GUROBI_ACCESS_ID"
              echo "::add-mask::$GUROBI_WLS_SECRET"
              echo "::add-mask::$GUROBI_LICENSE_ID"

              umask 077
              {
                echo "WLSACCESSID=$GUROBI_ACCESS_ID"
                echo "WLSSECRET=$GUROBI_WLS_SECRET"
                echo "LICENSEID=$GUROBI_LICENSE_ID"
              } > gurobi.lic
              chmod 600 gurobi.lic

              echo "GRB_LICENSE_FILE=$PWD/gurobi.lic" >> $GITHUB_ENV
              echo "FORECAST_OPTIMIZER=gurobi" >> $GITHUB_ENV
              echo "✅ Gurobi WLS license configured (development dispatch)"
            else
              echo "FORECAST_OPTIMIZER=highs" >> $GITHUB_ENV
              echo "⚠️ Gurobi requested but WLS credentials missing — falling back to HiGHS"
            fi
          else
            echo "FORECAST_OPTIMIZER=highs" >> $GITHUB_ENV
            echo "✅ HiGHS selected (production default)"
          fi

      - name: Install Julia dependencies
        run: |
          julia --project=. -e "
            using Pkg
            println(\"📦 Resolving dependencies...\")
            Pkg.resolve()
            println(\"📦 Installing dependencies...\")
            Pkg.instantiate()
            Pkg.precompile()
            println(\"✅ Dependencies installed successfully\")
          "

      - name: Setup database connection
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
        run: |
          julia --project=. -e "
            using Euphemia
            println(\"🔗 Testing database connection...\")
            try
              result = Euphemia.sql2df(\"SELECT 1 as test\")
              println(\"✅ Database connection successful\")
            catch e
              println(\"❌ Database connection failed: \$e\")
              exit(1)
            end
          "

      - name: Generate daily forecasts
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MAX_LEAD_DAYS="7"
            FORCE_RERUN="false"
          else
            MAX_LEAD_DAYS="${{ github.event.inputs.max_lead_days }}"
            FORCE_RERUN="${{ github.event.inputs.force_rerun }}"
          fi

          OPTIMIZER="$FORECAST_OPTIMIZER"
          SKIP_CLEAR="$FORECAST_SKIP_CLEAR"

          echo "🔮 Daily ex-ante forecast"
          echo "⚖️ Optimizer: $OPTIMIZER (skip_clear=$SKIP_CLEAR)"
          echo "📅 Max lead days: $MAX_LEAD_DAYS"
          echo "🔄 Force rerun: $FORCE_RERUN"

          export OPTIMIZER MAX_LEAD_DAYS FORCE_RERUN SKIP_CLEAR

          # Crash-retry (issue #182: HiGHS segfaults ~3-4% of decomposed
          # day-solves). Forecast slices are no-clobber, so a retry skips
          # everything already written and only redoes the crashed remainder —
          # the loop is idempotent.
          ok=false
          for attempt in 1 2 3; do
            if julia --project=. bin/daily_forecast.jl; then
              ok=true
              break
            fi
            echo "⚠️ forecast attempt $attempt failed — retrying (completed slices are skipped)"
          done
          if [ "$ok" != "true" ]; then
            echo "::error::daily forecast failed after 3 attempts"
            exit 1
          fi

      # Scoring/export/publish run even when the forecast step failed
      # (!cancelled()): whatever slices DID land — or landed in an earlier run
      # today — still get scored and pushed, so the site never goes stale
      # behind a solver crash. The job still reports failure (Slack notify).
      - name: Score realized forecasts
        if: ${{ !cancelled() }}
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
        run: |
          julia --project=. bin/score_forecasts.jl

      - name: Export forecast JSON
        if: ${{ !cancelled() }}
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
        run: |
          julia --project=. bin/export_forecast_json.jl

      - name: Publish web data plane to R2 (parquet for api.philokalia.ai)
        if: ${{ !cancelled() }}
        env:
          ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
          EXTRACT_S3_ENDPOINT: ${{ secrets.EXTRACT_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          WEB_S3_ACCESS_KEY_ID: ${{ secrets.WEB_S3_ACCESS_KEY_ID }}
          WEB_S3_SECRET_ACCESS_KEY: ${{ secrets.WEB_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # The SPA reads api.philokalia.ai (R2-backed) since the #179
          # migration; nothing was pushing the parquet after each run, so the
          # site data plane went stale (manifest frozen at the last manual
          # push). Export + push here, manifest last (readers never see a
          # manifest newer than its objects).
          julia --project=. bin/export_web_parquet.jl
          bash bin/web_data_push.sh

      - name: Upload forecast data artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: forecast-data
          path: web/data/
          if-no-files-found: warn

      - name: Cleanup Gurobi license
        if: always()
        run: rm -f gurobi.lic

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: |
            🚨 Daily ex-ante forecast failed!
            🔗 View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

# Full-history rescore of the HOURLY score columns of simulations.forecast_scores
# against the SDAC target (#431 PR C2, owner decision 2026-11-16). The daily scorer
# rescores only the last RESCORE_WINDOW_DAYS (7); everything older keeps the target
# it was scored with until this runs. Run it ONCE in the afternoon the flip merges,
# before the next 06:15 UTC, so no daily run can leave a mixed EXAA/SDAC history.
#
# Order: guard (time windows, active daily-forecast/publish-web-data runs; rechecked
# before every write chunk and before a restore, bin/rescore_guard.sh) -> snapshot
# (artifact) -> dry-run counts -> rescore in date chunks (one transaction per slice
# under SET LOCAL lock_timeout, #424 pattern; q15 columns never written), recording
# every key written + its scored_at (the CAMPAIGN artifact) -> snapshot-vs-now summary.
# Rollback: dispatch action=restore restore_run_id=<rescore run id>. It restores only
# that run's campaign keys, and only rows not rescored since (scored_at still the
# campaign's); also set the repo variable EUPHEMIA_DA_TARGET=highest_seq.
# Dispatch-only; the site picks the scores up at the next publish.
name: rescore-hourly

on:
  workflow_dispatch:
    inputs:
      action:
        description: "rescore (default) or restore (rolls back one earlier rescore run's campaign)"
        required: false
        default: rescore
        type: choice
        options: [rescore, restore]
      start:
        description: "First market date (YYYY-MM-DD); empty = full history"
        required: false
        default: ""
      end:
        description: "Last market date (YYYY-MM-DD); empty = up to today"
        required: false
        default: ""
      zones:
        description: "Zones to rescore: the four whose target changes (default) or 'all'"
        required: false
        default: "AT,DE_LU,DK1,DK2"
      chunk_days:
        description: "Market days per scorer invocation"
        required: false
        default: "31"
      dry_run:
        description: "Snapshot + counts only, write nothing"
        required: false
        default: false
        type: boolean
      restore_run_id:
        description: "action=restore: the rescore-hourly run id whose campaign to roll back"
        required: false
        default: ""

# contents: checkout; actions: read the run state of daily-forecast/publish-web-data
# for the guard, and a previous run's artifacts for restore. Nothing is written to GitHub.
permissions:
  contents: read
  actions: read

env:
  JULIA_VERSION: "1.13.4"   # same pin as daily-forecast.yml / rescore-q15.yml

# Own group: joining daily-forecast's could let a pending rescore supersede a daily run.
concurrency:
  group: rescore-hourly
  cancel-in-progress: false

jobs:
  rescore-hourly:
    runs-on: energy-markets-k8s
    timeout-minutes: 240
    env:
      ENERGY_CONN_STR: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ACTION: ${{ inputs.action }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      ZONES: ${{ inputs.zones }}
      CHUNK_DAYS: ${{ inputs.chunk_days }}
      DRY: ${{ inputs.dry_run }}
      RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
      # minutes of headroom required before a blackout window when a write starts
      GUARD_MARGIN_MIN: "20"
    steps:
      - uses: actions/checkout@v4

      - name: Guard (time windows, active writers, inputs)
        run: |
          for d in "$START" "$END"; do
            if [ -n "$d" ] && ! [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "::error::bad date '$d'"; exit 1; fi
          done
          if ! [[ "$CHUNK_DAYS" =~ ^[1-9][0-9]*$ ]]; then echo "::error::bad chunk_days '$CHUNK_DAYS'"; exit 1; fi
          if ! [[ "$ZONES" =~ ^(all|[A-Za-z0-9_,-]+)$ ]]; then echo "::error::bad zones '$ZONES'"; exit 1; fi
          if [ "$ACTION" = restore ] && ! [[ "$RESTORE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::action=restore needs restore_run_id"; exit 1
          fi
          # setup takes up to ~30 min: require that much headroom now; writes recheck later
          bash bin/rescore_guard.sh 30

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Install Julia dependencies
        timeout-minutes: 30
        run: |
          julia --project=. -e "
            using Pkg
            isempty(Pkg.Registry.reachable_registries()) && Pkg.Registry.add()
            Pkg.instantiate()
            Pkg.precompile()
          "

      - name: Snapshot hourly score columns (rollback artifact)
        run: |
          mkdir -p snapshot
          julia --project=. bin/forecast_scores_snapshot.jl snapshot snapshot/forecast_scores_hourly.csv
          gzip -9 snapshot/forecast_scores_hourly.csv

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: forecast-scores-hourly-snapshot-${{ github.run_id }}
          path: snapshot/forecast_scores_hourly.csv.gz
          retention-days: 90
          if-no-files-found: error

      - name: Dry run (counts only)
        if: ${{ inputs.action == 'rescore' }}
        env:
          DRY_RUN: "true"
          RESCORE: "true"
          HOURLY_ONLY: "true"
          EUPHEMIA_DA_TARGET: sdac
          RESCORE_START: ${{ inputs.start }}
          RESCORE_END: ${{ inputs.end }}
          RESCORE_ZONES: ${{ inputs.zones }}
        run: |
          set -o pipefail
          julia --project=. bin/score_forecasts.jl | tee dry_run.txt

      - name: Rescore hourly columns (SDAC target, q15 untouched)
        if: ${{ inputs.action == 'rescore' && !inputs.dry_run }}
        timeout-minutes: 150
        env:
          RESCORE: "true"
          HOURLY_ONLY: "true"
          SCORE_LOCK_TIMEOUT: 5s
          EUPHEMIA_DA_TARGET: sdac
          RESCORE_ZONES: ${{ inputs.zones }}
          RESCORE_KEYS_OUT: campaign/keys.csv
        run: |
          mkdir -p campaign
          first=$(grep -m1 '^DRY_RUN slices:' dry_run.txt | sed -E 's/.* over market dates ([0-9-]+)\.\.([0-9-]+)$/\1/')
          last=$(grep -m1 '^DRY_RUN slices:' dry_run.txt | sed -E 's/.* over market dates ([0-9-]+)\.\.([0-9-]+)$/\2/')
          if [ -z "$first" ] || [ -z "$last" ]; then echo "nothing to rescore"; exit 0; fi
          d="$first"
          while [[ ! "$d" > "$last" ]]; do
            e=$(date -u -d "$d + $((CHUNK_DAYS - 1)) days" +%F)
            [[ "$e" > "$last" ]] && e="$last"
            if ! bash bin/rescore_guard.sh "$GUARD_MARGIN_MIN"; then
              echo "::error::stopped before chunk $d..$e; resume later with start=$d (campaign so far is uploaded)"
              exit 1
            fi
            echo "::group::rescore $d..$e"
            RESCORE_START="$d" RESCORE_END="$e" julia --project=. bin/score_forecasts.jl
            echo "::endgroup::"
            echo "chunk done $d..$e"
            d=$(date -u -d "$e + 1 day" +%F)
          done

      - name: Upload campaign record (keys written + their scored_at)
        if: ${{ always() && inputs.action == 'rescore' && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: rescore-hourly-campaign-${{ github.run_id }}
          path: campaign/keys.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Download the campaign to roll back
        if: ${{ inputs.action == 'restore' && !inputs.dry_run }}
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ inputs.restore_run_id }}"
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ github.token }}
          path: restore
          merge-multiple: true

      - name: Roll back that campaign (its keys only, rows not rescored since)
        if: ${{ inputs.action == 'restore' && !inputs.dry_run }}
        env:
          CONFIRM_RESTORE: "yes"
        run: |
          test -f restore/keys.csv || { echo "::error::run $RESTORE_RUN_ID has no campaign record"; exit 1; }
          gunzip -kf restore/forecast_scores_hourly.csv.gz
          bash bin/rescore_guard.sh "$GUARD_MARGIN_MIN"
          julia --project=. bin/forecast_scores_snapshot.jl restore restore/forecast_scores_hourly.csv restore/keys.csv

      - name: Summary (scoring policy + snapshot vs now)
        if: ${{ always() }}
        run: |
          {
            echo "## rescore-hourly: action=$ACTION dry_run=$DRY"
            echo "Scoring policy: hourly target **sdac** (SDAC sequence 1 in AT/DE_LU; #431 C2, 2026-11-17)."
            echo "Range: ${START:-first}..${END:-today}; zones: $ZONES; q15 columns untouched."
            if [ -f campaign/keys.csv ]; then echo "Campaign record: $(($(wc -l < campaign/keys.csv) - 1)) keys written."; fi
            if [ -f dry_run.txt ]; then echo; echo '```'; grep '^DRY_RUN\|^  ' dry_run.txt | head -80; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f snapshot/forecast_scores_hourly.csv.gz ]; then
            gunzip -kf snapshot/forecast_scores_hourly.csv.gz
            julia --project=. bin/forecast_scores_snapshot.jl compare snapshot/forecast_scores_hourly.csv "$GITHUB_STEP_SUMMARY" || true
          fi

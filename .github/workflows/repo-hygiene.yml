name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-local-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject personal absolute paths
        shell: bash
        run: |
          # Exclude only this file, which contains the detection expressions.
          # No path allowlist: temporary test homes use a neutral directory name.
          if git grep -nIE '/home/[A-Za-z0-9._-]+/|/Users/[A-Za-z0-9._-]+/' -- . ':!.github/workflows/repo-hygiene.yml'; then
            echo 'Replace local home paths with repository-relative paths or explicit environment variables.'
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
          fi
          # Session scratch paths also encode usernames and private directories.
          if git grep -nIE '/tmp/claude-[^/[:space:]]+/-home-[^/[:space:]]+/' -- . ':!.github/workflows/repo-hygiene.yml'; then
            echo 'Replace session scratch paths with symbolic provenance or explicit environment variables.'
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
          fi

# Publish the record's side artifacts — owner-dispatched (2026-07-31 decision):
#   1. the per-day order-book parquets of a record backfill -> extract bucket
#      /books/ (the cv23-flow "books retained/published" step, now as CI);
#   2. the zone-strategies JSON -> web bucket /v1/zone_strategies.json (the
#      /about table; deliberately OUTSIDE the web data-plane auto-sync, so
#      publishing it is an explicit act — this workflow IS that act).
# Runs on the self-hosted runner, which lives on the machine that holds the
# backfill books (data/ is git-ignored; books never enter the repo).
name: publish-record-artifacts

on:
  workflow_dispatch:
    inputs:
      books_dir:
        description: "Absolute path (on the runner host) of the per-day book parquets; 'none' = skip books"
        required: false
        default: "/home/pgeorgakopoulos/armada/energy-markets/data/backfill_books_cv26"
      publish_zone_strategies:
        description: "Also publish the zone-strategies JSON to the web bucket"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Sync record books to the extract bucket
        if: ${{ inputs.books_dir != 'none' }}
        env:
          # The site's worker reads v1/books/<date>.parquet from the WEB bucket
          # (the daily flow: flush_books! writes data/web/v1/books locally and
          # web_data_push.sh syncs it) — publish the record books THERE with the
          # WEB credentials, which demonstrably create new keys daily. The
          # extract-bucket token intermittently AccessDenied's new-key bursts
          # and was the wrong destination for the site anyway.
          AWS_ACCESS_KEY_ID: ${{ secrets.WEB_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WEB_S3_SECRET_ACCESS_KEY }}
          EXTRACT_S3_ENDPOINT: ${{ secrets.EXTRACT_S3_ENDPOINT }}
          EXTRACT_S3_BUCKET: euphemia-web-data
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          # The R2 token has object read/write but NO bucket-list permission
          # (extract_store.sh precedent: cp only, never sync/ls). cp --recursive
          # lists only the LOCAL source; verify by HeadObject spot checks.
          test -d "${{ inputs.books_dir }}" || { echo "books_dir missing on runner host"; exit 1; }
          n_local=$(ls "${{ inputs.books_dir }}"/*.parquet | wc -l)
          # R2 intermittently rejects a few PutObjects in large bursts with
          # AccessDenied (observed: different keys each run). Bulk-copy first,
          # then verify EVERY key by HeadObject and retry stragglers
          # sequentially with backoff.
          export AWS_RETRY_MODE=standard AWS_MAX_ATTEMPTS=10
          aws s3 cp --recursive --endpoint-url "$EXTRACT_S3_ENDPOINT" \
            --exclude "*" --include "*.parquet" \
            "${{ inputs.books_dir }}" "s3://$EXTRACT_S3_BUCKET/v1/books/" || true
          missing=0
          for f in "${{ inputs.books_dir }}"/*.parquet; do
            key="v1/books/$(basename "$f")"
            for attempt in 1 2 3 4 5; do
              sz_remote=$(aws s3api head-object --endpoint-url "$EXTRACT_S3_ENDPOINT" \
                --bucket "$EXTRACT_S3_BUCKET" --key "$key" \
                --query ContentLength --output text 2>/dev/null || echo MISSING)
              [ "$sz_remote" = "$(stat -c%s "$f")" ] && break
              echo "retry $key (attempt $attempt, remote=$sz_remote)"
              sleep $((attempt * 2))
              aws s3 cp --endpoint-url "$EXTRACT_S3_ENDPOINT" "$f" \
                "s3://$EXTRACT_S3_BUCKET/$key" || true
            done
            sz_remote=$(aws s3api head-object --endpoint-url "$EXTRACT_S3_ENDPOINT" \
              --bucket "$EXTRACT_S3_BUCKET" --key "$key" \
              --query ContentLength --output text 2>/dev/null || echo MISSING)
            [ "$sz_remote" = "$(stat -c%s "$f")" ] || { echo "STILL FAILING: $key"; missing=$((missing+1)); }
          done
          [ "$missing" -eq 0 ] || { echo "$missing keys failed after retries"; exit 1; }
          echo "books: uploaded $n_local parquets, 3 spot-verified by HeadObject" 

      - name: Export + publish zone-strategies JSON to the web bucket
        if: ${{ inputs.publish_zone_strategies }}
        env:
          WEB_S3_ACCESS_KEY_ID: ${{ secrets.WEB_S3_ACCESS_KEY_ID }}
          WEB_S3_SECRET_ACCESS_KEY: ${{ secrets.WEB_S3_SECRET_ACCESS_KEY }}
          EXTRACT_S3_ENDPOINT: ${{ secrets.EXTRACT_S3_ENDPOINT }}
          WEB_S3_ENDPOINT: ${{ secrets.EXTRACT_S3_ENDPOINT }}
          WEB_S3_BUCKET: euphemia-web-data
          AWS_DEFAULT_REGION: auto
          # The runner checkout has no .env and no public extract, so module
          # init fails store auto-detection ("No data store available").
          # export_zone_strategies.jl only reads the code-defined ZONE_PROFILES,
          # but `using Euphemia` still needs A store — point it read-only at
          # the live extract on the runner host.
          EUPHEMIA_DATA_STORE: duckdb
          EUPHEMIA_DUCKDB_PATH: /home/pgeorgakopoulos/armada/energy-markets/data/extracts/euphemia-live.duckdb
          EUPHEMIA_DUCKDB_READONLY: "true"
        run: |
          set -euo pipefail
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=. bin/export_zone_strategies.jl
          test -s data/calibration/zone_strategies.json
          export AWS_ACCESS_KEY_ID="$WEB_S3_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$WEB_S3_SECRET_ACCESS_KEY"
          aws s3 cp --endpoint-url "$WEB_S3_ENDPOINT" \
            --content-type application/json --cache-control "max-age=300" \
            data/calibration/zone_strategies.json \
            "s3://$WEB_S3_BUCKET/v1/zone_strategies.json"
          aws s3 ls --endpoint-url "$WEB_S3_ENDPOINT" "s3://$WEB_S3_BUCKET/v1/zone_strategies.json"

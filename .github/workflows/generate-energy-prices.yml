name: Generate Energy Prices

on:
  schedule:
    # Run daily at 2 AM UTC for previous day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        default: '2025-11-01'
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        default: '2025-11-07'
        type: string
      parallel:
        description: 'Use parallel processing'
        required: false
        default: true
        type: boolean
      optimizer:
        description: 'Optimizer to use'
        required: false
        default: 'highs'
        type: choice
        options:
          - highs
          - gurobi
          - cplex
      max_workers:
        description: 'Maximum parallel workers (0 = auto-detect)'
        required: false
        default: '20'
        type: string
      order_method:
        description: 'Order generation method'
        required: false
        default: 'uc_based'
        type: choice
        options:
          - uc_based
          - alternative

env:
  JULIA_VERSION: '1.11'
  JULIA_NUM_THREADS: 4

jobs:
  generate-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 480  # 8 hours timeout
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: energy_markets
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Julia
      uses: julia-actions/setup-julia@v1
      with:
        version: ${{ env.JULIA_VERSION }}
        
    - name: Cache Julia packages
      uses: julia-actions/cache@v1
      
    - name: Setup Gurobi license (if using Gurobi)
      if: ${{ github.event.inputs.optimizer == 'gurobi' }}
      env:
        GUROBI_LICENSE_KEY: ${{ secrets.GUROBI_LICENSE_KEY }}
      run: |
        if [ -n "$GUROBI_LICENSE_KEY" ]; then
          echo "$GUROBI_LICENSE_KEY" > gurobi.lic
          echo "GRB_LICENSE_FILE=$PWD/gurobi.lic" >> $GITHUB_ENV
          echo "✅ Gurobi license configured"
        else
          echo "⚠️ No Gurobi license found, will fallback to HiGHS"
        fi
        
    - name: Install Julia dependencies
      run: |
        julia --project=. -e "
          using Pkg
          println(\"📦 Installing dependencies...\")
          Pkg.instantiate()
          Pkg.precompile()
          println(\"✅ Dependencies installed successfully\")
        "
        
    - name: Setup database connection
      env:
        DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/energy_markets
      run: |
        # Test database connection
        julia --project=. -e "
          using Euphemia
          println(\"🔗 Testing database connection...\")
          try
            result = Euphemia.sql2df(\"SELECT 1 as test\")
            println(\"✅ Database connection successful\")
          catch e
            println(\"❌ Database connection failed: \$e\")
            exit(1)
          end
        "
        
    - name: Generate energy prices
      id: generate
      env:
        DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/energy_markets
      run: |
        # Set default dates if manual trigger without inputs
        if [ "${{ github.event_name }}" = "schedule" ]; then
          # For scheduled runs, process previous day
          START_DATE=$(date -d "yesterday" +%Y-%m-%d)
          END_DATE=$START_DATE
          PARALLEL=true
          OPTIMIZER="highs"
          MAX_WORKERS=16
          ORDER_METHOD="uc_based"
        else
          # For manual runs, use inputs
          START_DATE="${{ github.event.inputs.start_date }}"
          END_DATE="${{ github.event.inputs.end_date }}"
          PARALLEL="${{ github.event.inputs.parallel }}"
          OPTIMIZER="${{ github.event.inputs.optimizer }}"
          MAX_WORKERS="${{ github.event.inputs.max_workers }}"
          ORDER_METHOD="${{ github.event.inputs.order_method }}"
        fi
        
        echo "📅 Processing date range: $START_DATE to $END_DATE"
        echo "⚖️ Optimizer: $OPTIMIZER"
        echo "⚡ Parallel: $PARALLEL"
        echo "👥 Max workers: $MAX_WORKERS"
        echo "📋 Order method: $ORDER_METHOD"
        
        julia --project=. -e "
          using Euphemia, Dates
          
          # Parse inputs
          start_date = Date(\"$START_DATE\")
          end_date = Date(\"$END_DATE\")
          use_parallel = parse(Bool, \"$PARALLEL\")
          optimizer = \"$OPTIMIZER\"
          max_workers_input = \"$MAX_WORKERS\"
          order_method = Symbol(\"$ORDER_METHOD\")
          
          # Parse max_workers (0 means auto-detect)
          max_workers = if max_workers_input == \"0\"
            nothing
          else
            parse(Int, max_workers_input)
          end
          
          println(\"🚀 Starting energy price generation\")
          println(\"📅 Date range: \$start_date to \$end_date\")
          println(\"⚡ Parallel: \$use_parallel\")
          println(\"👥 Max workers: \$(max_workers === nothing ? \"auto\" : max_workers)\")
          println(\"⚖️ Optimizer: \$optimizer\")
          println(\"📋 Order method: \$order_method\")
          println()
          
          try
            # Generate energy prices for date range
            result = generate_energy_prices_for_date_range(
              start_date, end_date;
              order_method=order_method,
              model=:mpcc,
              optimizer=optimizer,
              save_to_db=true,
              skip_existing=true,
              parallel=use_parallel,
              max_workers=max_workers,
              chunk_size=3,
              silent=true,
              max_retries=3,
              retry_delay=2.0
            )
            
            # Extract metrics
            successful_dates = result.successful_dates
            total_dates = result.total_dates
            total_zones_processed = result.total_zones_processed
            total_zones_successful = result.total_zones_successful
            total_time_hours = round(result.total_time/3600, digits=2)
            
            # Calculate success rates
            date_success_rate = total_dates > 0 ? round(100 * successful_dates / total_dates, digits=1) : 0.0
            zone_success_rate = total_zones_processed > 0 ? round(100 * total_zones_successful / total_zones_processed, digits=1) : 0.0
            
            # Log success metrics
            println()
            println(\"=\"^60)
            println(\"🎉 GENERATION COMPLETED SUCCESSFULLY\")
            println(\"=\"^60)
            println(\"✅ Date success: \$successful_dates/\$total_dates (\$date_success_rate%)\")
            println(\"✅ Zone success: \$total_zones_successful/\$total_zones_processed (\$zone_success_rate%)\")
            println(\"⏱️ Total time: \$total_time_hours hours\")
            println()
            
            # Set outputs for GitHub Actions
            open(ENV[\"GITHUB_OUTPUT\"], \"a\") do io
              println(io, \"successful_dates=\$successful_dates\")
              println(io, \"total_dates=\$total_dates\")
              println(io, \"date_success_rate=\$date_success_rate\")
              println(io, \"zone_success_rate=\$zone_success_rate\")
              println(io, \"processing_time_hours=\$total_time_hours\")
              println(io, \"total_zones_processed=\$total_zones_processed\")
              println(io, \"total_zones_successful=\$total_zones_successful\")
              println(io, \"status=success\")
            end
            
            # Detailed analysis
            if total_zones_successful > 0
              successful_summaries = filter(s -> s.zones_successful > 0, result.daily_summaries)
              if !isempty(successful_summaries)
                avg_price = sum(s.avg_price * s.zones_successful for s in successful_summaries) / sum(s.zones_successful for s in successful_summaries)
                min_price = minimum(s.min_price for s in successful_summaries if s.min_price > 0)
                max_price = maximum(s.max_price for s in successful_summaries if s.max_price > 0)
                
                println(\"💰 Price Analysis:\")
                println(\"   📊 Range: €\$(min_price) - €\$(max_price)/MWh\")
                println(\"   📈 Weighted average: €\$(round(avg_price, digits=2))/MWh\")
                
                # Set price outputs
                open(ENV[\"GITHUB_OUTPUT\"], \"a\") do io
                  println(io, \"avg_price=\$(round(avg_price, digits=2))\")
                  println(io, \"min_price=\$(min_price)\")
                  println(io, \"max_price=\$(max_price)\")
                end
              end
            end
            
            # Check for any failures
            if successful_dates < total_dates
              println()
              println(\"⚠️ PARTIAL SUCCESS - Some dates failed:\")
              failed_dates = [r.date for r in result.date_results if !r.success]
              println(\"❌ Failed dates: \$(join(failed_dates, \", \"))\")
              
              # Still exit successfully if we got some results
              if successful_dates > 0
                println(\"✅ Continuing as \$successful_dates dates were processed successfully\")
                exit(0)
              else
                println(\"❌ All dates failed - marking as failure\")
                exit(1)
              end
            end
            
          catch e
            println()
            println(\"❌ CRITICAL ERROR during energy price generation:\")
            println(\"Error: \$e\")
            
            # Set failure outputs
            open(ENV[\"GITHUB_OUTPUT\"], \"a\") do io
              println(io, \"successful_dates=0\")
              println(io, \"total_dates=0\")
              println(io, \"status=failure\")
              println(io, \"error_message=\$e\")
            end
            
            exit(1)
          end
        "
        
    - name: Create execution summary
      if: always()
      run: |
        echo "## 📊 Energy Price Generation Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ github.event_name }}" = "schedule" ]; then
          TRIGGER="⏰ Scheduled (daily)"
          DATE_RANGE="$(date -d "yesterday" +%Y-%m-%d)"
        else
          TRIGGER="🖱️ Manual"
          DATE_RANGE="${{ github.event.inputs.start_date }} to ${{ github.event.inputs.end_date }}"
        fi
        
        echo "### Execution Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger**: $TRIGGER" >> $GITHUB_STEP_SUMMARY
        echo "- **Date Range**: $DATE_RANGE" >> $GITHUB_STEP_SUMMARY
        echo "- **Optimizer**: ${{ github.event.inputs.optimizer || 'highs' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Parallel**: ${{ github.event.inputs.parallel || 'true' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Order Method**: ${{ github.event.inputs.order_method || 'uc_based' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.generate.outputs.status }}" = "success" ]; then
          echo "### ✅ Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Date Success**: ${{ steps.generate.outputs.successful_dates }}/${{ steps.generate.outputs.total_dates }} (${{ steps.generate.outputs.date_success_rate }}%)" >> $GITHUB_STEP_SUMMARY
          echo "- **Zone Success**: ${{ steps.generate.outputs.total_zones_successful }}/${{ steps.generate.outputs.total_zones_processed }} (${{ steps.generate.outputs.zone_success_rate }}%)" >> $GITHUB_STEP_SUMMARY
          echo "- **Processing Time**: ${{ steps.generate.outputs.processing_time_hours }} hours" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ steps.generate.outputs.avg_price }}" ]; then
            echo "- **Price Range**: €${{ steps.generate.outputs.min_price }} - €${{ steps.generate.outputs.max_price }}/MWh" >> $GITHUB_STEP_SUMMARY
            echo "- **Average Price**: €${{ steps.generate.outputs.avg_price }}/MWh" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "### ❌ Failure" >> $GITHUB_STEP_SUMMARY
          echo "- **Error**: ${{ steps.generate.outputs.error_message || 'Unknown error' }}" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Notify on failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        text: |
          🚨 Energy price generation failed!
          📅 Date range: ${{ github.event.inputs.start_date || 'yesterday' }} to ${{ github.event.inputs.end_date || 'yesterday' }}
          🔗 View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      continue-on-error: true
        
    - name: Notify on success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        text: |
          ✅ Energy price generation completed successfully!
          📅 Processed: ${{ steps.generate.outputs.successful_dates }}/${{ steps.generate.outputs.total_dates }} dates
          🌍 Zone success: ${{ steps.generate.outputs.zone_success_rate }}%
          ⏱️ Time: ${{ steps.generate.outputs.processing_time_hours }} hours
      continue-on-error: true